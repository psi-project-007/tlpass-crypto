# .github/workflows/ci.yml
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 22 with npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test in Node with coverage (90% lines)
        run: npm run coverage

      - name: Install headless Chromium
        run: npx playwright install --with-deps --only-shell chromium

      - name: Test in headless Chromium
        run: npm run test:browser

      - name: Build
        run: npm run build

      - name: Package imports in Node
        run: node -e "import('./dist/index.js').then(m => console.log(Object.keys(m).length + ' exports'))"